<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 常无鱼以观其喵</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      var sys = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t || sys;
    } catch (e) {}
  })();
</script>
</head>
<body>
<main class="wrap" style="min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:80px 0">
  <p class="eyebrow"><span class="dot" style="background:var(--muted-2);box-shadow:none"></span> 404</p>
  <h1 class="name" style="font-size:clamp(28px,5vw,44px)">这里什么也没有</h1>
  <p class="lede" style="margin-bottom:8px">页面不存在，或者它被我搬到 NAS 上去了。</p>
  <div class="hero-actions">
    <a class="btn primary" href="/">回到首页</a>
    <a class="btn ghost" href="https://github.com/Snowkei" target="_blank" rel="noopener">GitHub <span class="arrow">↗</span></a>
  </div>
</main>
</body>
</html>
